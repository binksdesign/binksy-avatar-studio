<style>[hidden]{display:none!important}
:root{--bg:#161616;--bg2:#1c1c1e;--bg3:#232326;--line:#2c2c30;--line2:#3a3a40;--tx:#ededed;--mu:#8b8b92;--acc:#ff5500;--sel:#f2f2f2;--r:12px;--panel:388px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg3);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#666}
textarea{width:100%;resize:vertical;min-height:70px}
svg{flex:none}
#app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand b{display:block;font-size:14px;letter-spacing:-.01em}.brand small{color:var(--mu);font-size:11px;white-space:nowrap}
.mark{width:30px;height:30px;border-radius:9px;background:#0f0f10;border:1px solid var(--line);display:grid;place-items:center}
.tools{display:flex;align-items:center;gap:4px}.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.ib{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;color:#d8d8dc}
.ib:hover{background:var(--bg3);border-color:var(--line)}.ib:disabled{opacity:.35;pointer-events:none}.ib.sm{width:30px;height:30px}.ib.on{background:var(--bg3);border-color:var(--line2);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:10px;border:1px solid var(--line2);background:var(--bg3);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#55555c}.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}.btn.primary:hover{filter:brightness(1.08)}.btn.ghost{background:transparent}.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:8px}.btn:disabled{opacity:.45;pointer-events:none}.btn.danger{color:#ff8a80}
main{flex:1;display:flex;min-height:0}
.stage{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.view{flex:1;position:relative;min-height:0;touch-action:none;overflow:hidden}
.view canvas,#flat{position:absolute;inset:0;width:100%;height:100%}
#flat{display:grid;place-items:center;padding-bottom:4%}#flat svg{width:min(46vmin,460px);height:auto}
.pill{position:absolute;left:16px;top:14px;padding:5px 10px;border-radius:99px;background:rgba(30,30,32,.8);border:1px solid var(--line);color:var(--mu);font-size:11px;pointer-events:none;backdrop-filter:blur(6px)}
.vbtns{position:absolute;right:12px;top:12px;display:flex;gap:4px}
.inapp{position:absolute;left:24px;bottom:22px;width:min(380px,calc(100% - 48px));padding:12px 14px 6px;border-radius:14px;background:rgba(22,22,24,.82);border:1px solid var(--line);backdrop-filter:blur(8px)}
.ia-h{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:11px;margin-bottom:6px}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-size:11px;cursor:pointer}.chk input{width:13px;height:13px;margin:0;accent-color:#999}
.row{display:flex;align-items:center;gap:12px;padding:6px 6px;border-radius:9px;cursor:default}.row:hover{background:rgba(255,255,255,.04)}
.row .av{flex:none;display:grid;place-items:center;width:40px;height:40px}.row canvas{display:block}.row b{font-weight:600;font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--mu);font-size:11px}
.row .role{color:var(--mu);font-weight:400;margin-left:6px}
.panel{width:var(--panel);flex:none;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--bg2);min-height:0}
.tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;padding:9px 10px 10px;border:0;background:none;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;font-weight:500;font-size:12.5px}
.tabs button.on{color:#fff;border-bottom-color:#fff}
.tabbody{flex:1;overflow-y:auto;padding:4px 16px 40px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#3a3a40 transparent}
.sec{padding:14px 0 6px}.sec>h3{margin:0 0 9px;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}.sec>h3 small{font-weight:400;color:var(--mu);font-size:11px}
.help{color:var(--mu);font-size:11.5px;margin:-3px 0 9px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.grid.g5{grid-template-columns:repeat(5,1fr)}.grid.g3{grid-template-columns:repeat(3,1fr)}
.cell{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 6px;border-radius:12px;border:1.5px solid transparent;background:none;cursor:pointer;min-width:0}
.cell:hover{background:rgba(255,255,255,.035)}.cell.on{border-color:var(--sel)}
.cell .th{width:52px;height:52px;display:grid;place-items:center;position:relative}.cell .th canvas,.cell .th svg{width:52px;height:52px}
.cell span{font-size:10.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.cell.on span{color:#fff}
.cell .badge{position:absolute;right:-2px;top:-2px;width:16px;height:16px;border-radius:99px;background:#fff;color:#111;display:grid;place-items:center}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.sw button{aspect-ratio:1;border-radius:99px;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);opacity:.86}.sw button:hover{opacity:1}.sw button.on{border-color:#fff;opacity:1}
.sw .own{background:conic-gradient(#e8461b,#21b34a,#e0157c,#7a2ff0,#e3263b,#f2b100,#e8461b)}
.seg{display:flex;gap:4px;flex-wrap:wrap}.seg button{padding:6px 12px;border-radius:99px;border:1px solid var(--line2);background:transparent;cursor:pointer;color:#cfcfd4;font-size:12px}.seg button.on{background:#f2f2f2;color:#111;border-color:#f2f2f2}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin:8px 0}.sl label{font-size:12px;color:#cfcfd4}.sl output{font-size:11px;color:var(--mu);font-variant-numeric:tabular-nums}
.sl input[type=range]{grid-column:1/-1;width:100%;padding:0;border:0;background:none;accent-color:#2f7cf6;height:22px}
.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.line>*{min-width:0}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;font-size:12.5px;cursor:pointer}.tog input{appearance:none;width:34px;height:20px;border-radius:99px;background:#3a3a40;position:relative;cursor:pointer;flex:none;padding:0;border:0}.tog input::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:99px;background:#fff;transition:transform .15s}.tog input:checked{background:#2f7cf6}.tog input:checked::after{transform:translateX(14px)}
input[type=color]{width:34px;height:30px;padding:2px;border-radius:8px;cursor:pointer}
.card{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:var(--bg)}
.acc-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;border:1px solid var(--line);margin:4px 0;cursor:pointer}.acc-item.on{border-color:#888}.acc-item b{flex:1;font-weight:500}
.agent{display:flex;align-items:center;gap:8px;padding:6px;border-radius:11px;border:1.5px solid var(--line);margin:6px 0}.agent.on{border-color:#fff}.agent .th{width:44px;height:44px;flex:none;cursor:pointer}.agent .th canvas,.agent .th svg{width:44px;height:44px}.agent .f{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.agent input{padding:4px 7px;font-size:12px;border-radius:7px}
.vars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.vars button{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer}.vars button:hover{border-color:#777}.vars canvas,.vars svg{width:100%;height:auto;aspect-ratio:1}
.err{color:#ff9c8f;background:rgba(255,80,60,.08);border:1px solid rgba(255,80,60,.25);padding:8px 10px;border-radius:9px;font-size:12px;margin:8px 0}
.ok{color:#9be3a8;background:rgba(60,200,90,.07);border:1px solid rgba(60,200,90,.22);padding:8px 10px;border-radius:9px;font-size:12px;margin:8px 0}
.muted{color:var(--mu)}code,.mono{font:11.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chips label{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid var(--line2);border-radius:99px;font-size:11.5px;cursor:pointer}.chips input{margin:0;accent-color:#f2f2f2}
.fmt{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.fmt button{padding:8px 4px;border-radius:10px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-size:12px;color:#d0d0d5}.fmt button.on{background:#f2f2f2;color:#111;border-color:#f2f2f2}.fmt button small{display:block;font-size:10px;opacity:.65}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:16px}.mbox{position:relative;width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:18px 18px 16px}.mbox h2{margin:0 0 10px;font-size:16px}.mclose{position:absolute;right:10px;top:10px}
.prog{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:60}.pbox{width:min(360px,90vw);background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}.bar{height:6px;border-radius:9px;background:#333;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .12s}
#toasts{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:70;pointer-events:none}.toast{background:#2a2a2e;border:1px solid var(--line2);padding:9px 14px;border-radius:11px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.flat-flip{animation:fflip .6s}.flat-pop{animation:fpop .6s}.flat-dissolve{animation:fdis .7s}.flat-warp{animation:fwarp .6s}
@keyframes fflip{50%{transform:rotateY(90deg)}}@keyframes fpop{38%{transform:scale(0)}70%{transform:scale(1.12)}}@keyframes fdis{50%{opacity:0;filter:blur(6px)}}@keyframes fwarp{50%{transform:scale(1.12,.88)}}
.kbd{border:1px solid var(--line2);border-radius:5px;padding:0 4px;font-size:10.5px;color:var(--mu)}
.pal{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.pal i{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
@media (max-width:900px){
  :root{--panel:100%}
  html,body{height:auto;min-height:100%}
  #app{height:auto;min-height:100%}
  main{flex-direction:column}
  .stage{position:sticky;top:0;z-index:5;flex:none;height:var(--sh,44vh);background:var(--bg);border-bottom:1px solid var(--line)}
  .inapp{display:none}
  .panel{border-left:0;min-height:56vh;flex:none}
  .tabbody{overflow:visible;padding-bottom:calc(60px + env(safe-area-inset-bottom))}
  .tabs{position:sticky;top:var(--sh,44vh);z-index:4;background:var(--bg2)}
  .brand small{display:none}.top{padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top))}
  .btn.primary .lbl{display:none}.btn.primary{width:36px;padding:0}
  .ib{width:36px;height:36px}.sep{display:none}
  #flat svg{width:min(40vh,70vw)}
  .cell .th,.cell .th canvas,.cell .th svg{width:56px;height:56px}
  .mobile-inapp{display:block!important}
}
@media (max-width:400px){.tools .ib#bJson,.tools .ib#bPresets{display:none}}
.mobile-inapp{display:none}

<div id="app">
  <header class="top">
    <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="4.5" width="18" height="16" rx="8" fill="#7a2ff0"/><rect x="8.2" y="9" width="2.4" height="6" rx="1.2" fill="#f6f2ea"/><rect x="13.4" y="9" width="2.4" height="6" rx="1.2" fill="#f6f2ea"/><circle cx="19.6" cy="4.4" r="2.2" fill="#ff5500"/></svg></span><div><b>Binksy Avatar</b><small>avatars d’agents · Binks</small></div></div>
    <div class="tools">
      <button class="ib" id="bUndo" title="Annuler (Ctrl+Z)" aria-label="Annuler"></button>
      <button class="ib" id="bRedo" title="Rétablir (Ctrl+Maj+Z)" aria-label="Rétablir"></button>
      <span class="sep"></span>
      <button class="ib" id="bRand" title="Aléatoire" aria-label="Aléatoire"></button>
      <button class="ib" id="bShare" title="Copier le lien partageable" aria-label="Lien partageable"></button>
      <button class="ib" id="bJson" title="Configuration JSON (copier / importer)" aria-label="JSON"></button>
      <button class="ib" id="bPresets" title="Mes avatars" aria-label="Mes avatars"></button>
      <button class="ib" id="bSettings" title="Réglages (clé OpenRouter, modèle, WebMCP)" aria-label="Réglages"></button>
      <button class="btn primary" id="bExport"><span class="i-dl"></span><span class="lbl">Exporter</span></button>
    </div>
  </header>
  <main>
    <section class="stage">
      <div class="view" id="view"><canvas id="cv"></canvas><div id="flat" hidden></div>
        <div class="pill" id="pill"></div>

      </div>
      <div class="inapp" id="inapp">
        <div class="ia-h"><span>Dans l’app — survole une ligne</span><label class="chk"><input type="checkbox" id="alwaysAnim"> toujours animer</label></div>
        <div id="rows"></div>
      </div>
    </section>
    <aside class="panel">
      <nav class="tabs" id="tabs">
        <button data-tab="avatar">Avatar</button><button data-tab="render">Rendu</button><button data-tab="acc">Accessoires</button><button data-tab="team">Équipe</button><button data-tab="ai">IA</button><button data-tab="export">Export</button>
      </nav>
      <div class="tabbody" id="tabbody"></div>
    </aside>
  </main>
</div>
